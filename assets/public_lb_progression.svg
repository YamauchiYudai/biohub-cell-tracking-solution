<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Best Public LB over September 2026</title>
<desc id="d">Step chart of the best public leaderboard score: 0.936 on Sep 4 (public stack control), 0.941 on Sep 5, 0.946 on Sep 17, 0.953 on Sep 24 (x138 public base), 0.954 on Sep 25 (b1c relink), 0.964 on Sep 26 (T3 division recovery), 0.964 on Sep 28 with J2 smoothing, 0.966 on Sep 29 with the frozen-frame consensus and the F03 head.</desc>
<style>
.bg{fill:#fcfcfb}.grid{stroke:#e1e0d9;stroke-width:1}.axis{fill:#898781;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.title{fill:#0b0b0b;font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}.sub{fill:#52514e;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.lab{fill:#0b0b0b;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}.val{fill:#52514e;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.line{fill:none;stroke:#2a78d6;stroke-width:2;stroke-linejoin:round}.dot{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.grid{stroke:#2c2c2a}.title,.lab{fill:#ffffff}.sub,.val{fill:#c3c2b7}.line{stroke:#3987e5}.dot{fill:#3987e5;stroke:#1a1a19}}
