# Final submission configuration.
#
# Final rank and leaderboard scores are shown in one place only: the "Competition Result" table in README.md.
# `result.final_submission` records which candidate that result belongs to; `notebook.candidate` names the
# candidate whose code is in notebooks/final_submission.ipynb;
# `python scripts/prepare_notebook.py --candidate <name>` rewrites the notebook and checks its code-cell
# SHA-256 against `candidates.<name>.code_sha256`. tests/test_submission.py checks this file against the
# committed notebook.

result:
  final_submission: TBD             # a key of `candidates`, set after the private leaderboard is published

competition:
  slug: biohub-cell-tracking-during-development
  final_deadline_utc: "2026-09-29T23:59:00Z"

notebook:
  path: notebooks/final_submission.ipynb
  candidate: core                   # the confirmed-0.964 core every final-day candidate is built on

# Team-owned settings of the production path (cell-0 environment overrides on top of configs/default.yaml).
production_env:
  BIOHUB_X138_RELINK_VARIANT: "b1c"               # jump-aware relink: global translation prior after duplicated frames
  BIOHUB_SUBMIT_DIVISION_METHOD: "A"              # learned division scorer: T3 3D CNN
  BIOHUB_SUBMIT_DIVISION_TAU_ADD: "0.3"           # add a gated fork when T3 >= 0.3
  BIOHUB_SUBMIT_DIVISION_TAU_DEL: "0.01"          # remove a rule-based safe-div fork when T3 < 0.01
  BIOHUB_SUBMIT_DIVISION_GEOMETRY: "none,none,none,none"
  BIOHUB_SUBMIT_DIVISION_ADD_GATE: "prob_angle_t2"  # p(P->D2) cached, angle >= 90 deg, sisters separate at t+2
  BIOHUB_SUBMIT_DIVISION_ADD_CAP: "exempt"        # V5a: learned adds are not limited by safe-div's budget
  BIOHUB_CACHE_EDGE_THRESHOLD: "0.48"             # upstream 1.0; caches Transformer edges > 0.48 for the gate
  BIOHUB_OUTPUT_LINEFIT_JUMP_AWARE: "1"           # J2 smoothing
  BIOHUB_REPAIR_DEADLINE_S: "36000"               # upstream 27000; post-processing deadline inside Kaggle's 12 h
  BIOHUB_RUN_MODE: "submit"

# Environment switches added by optional edits (see biohub_tracking.kaggle.variants).
edit_env:
  frozen_consensus:
    BIOHUB_OUTPUT_FROZEN_CONSENSUS: "1"

# Kaggle inputs attached to the notebook (besides the competition data).
inputs:
  common:
    - pilkwang/biohub-tracking-support-pack-50ep-v1        # upstream code + primary TemporalUNet3D / Transformer (CC0-1.0)
    - pilkwang/biohub-temporal-unet3d-seed314159-v1        # second detector seed (CC0-1.0)
    - pilkwang/biohub-deepcenter-unet3d-center-prior-v1    # DeepCenter centre prior (CC0-1.0)
    - yudaiyamauchi/biomed-x138-division-t3-full-weights   # T3 division CNN, 3 seeds, all train movies (team)
  head_public: anvithpothula/biohub-v1284-head-s075        # V1284 coordinate head (CC0-1.0)
  head_f03: yudaiyamauchi/biomed-x138-v1284-head-f03       # F03 fine-tuned head (team), sha256 checked in cell 4

