# Upstream configuration inherited unchanged from the public "biohub x138" notebook (Apache-2.0).
#
# These are the cell-0 environment overrides of the upstream notebook that the production notebook keeps as
# they are. They were tuned by the public-notebook authors, not by this team; they are recorded here so the
# full production configuration is readable in one place. tests/test_submission.py checks that every value
# matches notebooks/final_submission.ipynb.
#
# The two upstream keys this team changed (BIOHUB_REPAIR_DEADLINE_S, BIOHUB_CACHE_EDGE_THRESHOLD) are in
# configs/final.yaml together with the team's own settings.

upstream_env:
  # Detection (dual-seed TemporalUNet3D, fused with harmonic bidirectional association)
  BIOHUB_DET_THRESHOLD: "0.965"
  BIOHUB_BIDIRECTIONAL_EDGE_WEIGHT: "0.15"
  BIOHUB_BIDIRECTIONAL_FUSION_MODE: "harmonic_probability"
  BIOHUB_DUAL_SEED_MIN_CANDIDATE_RETENTION: "0.90"
  BIOHUB_DIAGNOSTIC_ARM: "harmonic_association_production"
  BIOHUB_LOWDET_THRESHOLD: "0.3"
  # ILP (global graph optimisation over detections and Transformer candidate edges)
  BIOHUB_ILP_APPEARANCE_WEIGHT: "0.0"
  BIOHUB_ILP_DISAPPEARANCE_WEIGHT: "2"
  BIOHUB_ILP_DIVISION_WEIGHT: "1.2"
  BIOHUB_ILP_TIMEOUT_S: "1200"
  # Motion relink (Hungarian re-assignment per transition with a neighbourhood-flow prior)
  BIOHUB_MOTION_RELINK_LEARNED_BONUS: "1.0"
  BIOHUB_MOTION_RELINK_TIGHT_UM: "5.5"
  BIOHUB_MOTION_RELINK_FLOW_MODE: "seed"
  BIOHUB_MOTION_RELINK_FLOW_K: "12"
  BIOHUB_MOTION_RELINK_FLOW_RADIUS_UM: "40.0"
  BIOHUB_MOTION_RELINK_FLOW_EXCLUDE_UM: "1.5"
  BIOHUB_MOTION_RELINK_FLOW_MIN_SAMPLES: "4"
  BIOHUB_MOTION_RELINK_FLOW_GATE: "1"
  BIOHUB_MOTION_RELINK_FLOW_ITER: "1"
  BIOHUB_MOTION_RELINK_FLOW_SEED_GATE_UM: "0"
  BIOHUB_MOTION_RELINK_FLOW_RAW_ADMIT: "1"
  BIOHUB_MOTION_RELINK_FLOW_Z_WEIGHT: "1.0"
  BIOHUB_MOTION_RELINK_FLOW_RAW_COST: "0"
  BIOHUB_MOTION_RELINK_FLOW_TIGHT_UM: "7.0"
  BIOHUB_MOTION_RELINK_FLOW_RELAXED_UM: "0"
  # Re-admission of discarded detections and gap filling from low-score peaks
  BIOHUB_READMIT_RADIUS_UM: "4"
  BIOHUB_READMIT_MIN_SCORE: "0.965"
  BIOHUB_GAPFILL_MAX_GAP: "3"
  BIOHUB_GAPFILL_MIN_SCORE: "0.5"
  BIOHUB_GAPFILL_STEP_UM: "5.0"
  BIOHUB_GAPFILL_PEAK_RADIUS_UM: "3.5"
  BIOHUB_GAPFILL_EXCLUDE_UM: "2.0"
  BIOHUB_GAPFILL_ALLOW_SYNTHETIC: "0"
  BIOHUB_GAPFILL_CONTEXT: "1"
  BIOHUB_GAPFILL_MAX_ADDED_FRAC: "0.03"
  # Gap closing
  BIOHUB_GAP_CLOSE_MAX_GAP: "2"
  BIOHUB_GAP_CLOSE_UM: "5.0"
  BIOHUB_GAP_DENSITY_ADAPTIVE: "1"
  BIOHUB_GAP_DENSITY_REFERENCE_UM: "6.5"
  BIOHUB_GAP_DENSITY_GAIN: "0.040"
  BIOHUB_GAP_DENSITY_MAX_STEP_DELTA_UM: "0.125"
  BIOHUB_GAP_DENSITY_NEIGHBORS: "3"
  # DeepCenter centre prior (vetoes gap-closing and safe-division points)
  BIOHUB_USE_DEEPCENTER_VETO: "1"
  BIOHUB_REQUIRE_DEEPCENTER_VETO: "1"
  BIOHUB_DEEPCENTER_EXPECTED_EPOCH: "2"
  BIOHUB_DEEPCENTER_GAP_CONFIRM_MIN_SPAN_UM: "8.5"
  BIOHUB_DEEPCENTER_CHECKPOINT: "/kaggle/input/biohub-deepcenter-unet3d-center-prior-v1/weights/full_frame_center/best.pt"
  BIOHUB_DEEPCENTER_GAP_VETO: "1"
  BIOHUB_DEEPCENTER_GAP_THRESHOLD: "0.25"
  BIOHUB_DEEPCENTER_SAFE_DIV_VETO: "1"
  BIOHUB_DEEPCENTER_SAFE_DIV_THRESHOLD: "0.25"
  BIOHUB_DEEPCENTER_TTA: "1"
  # Rule-based safe division
  BIOHUB_SAFE_DIV_MAX_UM: "9.0"
  BIOHUB_SAFE_DIV_SISTER_MAX_UM: "14.0"
  BIOHUB_SAFE_DIV_SISTER_SYMMETRY_TAU: "0.6"
  BIOHUB_SAFE_DIV_DIVERGE_UM: "2.25"
  BIOHUB_SAFE_DIV_EXISTING_CHILD_MAX_UM: "10.0"
  BIOHUB_SAFE_DIV_FRAME_FRAC_CAP: "0.0076"
  BIOHUB_SAFE_DIV_GLOBAL_FRAC_CAP: "0.00375"
  # Output filtering (short tracks, rescue) and smoothing
  BIOHUB_OUTPUT_FILTER_SHORT_TRACKS: "1"
  BIOHUB_OUTPUT_MIN_TRACK_LEN: "6"
  BIOHUB_OUTPUT_KEEP_DIVISION_COMPONENTS: "1"
  BIOHUB_OUTPUT_GAP2_RECOVERY: "1"
  BIOHUB_ADAPTIVE_SHORT_TRACK_RESCUE: "1"
  BIOHUB_SHORT_TRACK_RESCUE_MIN_LEN: "4"
  BIOHUB_SHORT_TRACK_RESCUE_MIN_MEAN_EDGE_PROB: "0.88"
  BIOHUB_SHORT_TRACK_RESCUE_MAX_MEAN_EDGE_DIST_UM: "3.0"
  BIOHUB_SHORT_TRACK_RESCUE_MAX_NODES_FRAC: "0.012"
  BIOHUB_SHORT_TRACK_RESCUE_MAX_NODES_ABS: "120"
  # Runtime, caches and the built-in validator (disabled in submissions)
  BIOHUB_RUN_OUTPUT_DIAGNOSTICS: "0"
  BIOHUB_VALIDATOR_N_PER_TYPE: "4"
  BIOHUB_PPSWEEP_SELECT_MARGIN: "0.001"
  BIOHUB_PPSWEEP_MAX_ADJ_LOSS: "0.0005"
  BIOHUB_VALIDATOR_ENABLE: "0"
  BIOHUB_FRAME_CACHE_MAX_FRAMES: "48"
  BIOHUB_CACHE_DIR: "/kaggle/working/edge_cache"
