name: Security and tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install current dependencies and scanners
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install -e '.[dev,torch,metric,security]' matplotlib
      - name: Secrets and private artifacts (including Git history)
        run: python scripts/check_release_security.py --history
      - name: Static security analysis (medium and high severity)
        run: bandit -r src scripts -ll
      - name: Known dependency vulnerabilities
        run: pip-audit --skip-editable
      - name: Unit and security regression tests
        run: pytest -q
      - name: Submission parity and restricted-loading derivative
        run: |
          python scripts/prepare_notebook.py --check
          python scripts/prepare_safe_notebook.py
