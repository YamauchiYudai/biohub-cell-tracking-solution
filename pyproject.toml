[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biohub-tracking"
version = "1.0.0"
description = "Solution code for Kaggle 'Biohub - Cell Tracking During Development': learned division recovery, jump-aware relinking and smoothing on top of a public 3D tracking pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# T3 division CNN and the V1284 coordinate head (training / offline scoring)
torch = [
    "torch>=2.2",
    "scikit-learn>=1.3",
    "zarr>=3.0",
]
# Local scoring with the organisers' official metric (royerlab/kaggle-cell-tracking-competition, BSD-3-Clause)
metric = [
    "zarr>=3.0",
    "polars>=1.0",
    "geff>=0.1",
    "tracksdata",
    "tracking-cellmot @ git+https://github.com/royerlab/kaggle-cell-tracking-competition@075fc5f5a52d11077f9dc2b074644618f26939e2",
]
dev = [
    "pytest>=8.0",
    "scikit-learn>=1.3",   # imported by the notebook's embedded modules that the parity tests load
    "ruff>=0.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/biohub_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebook: executes code extracted from notebooks/final_submission.ipynb"]

[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
